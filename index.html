<div id="trainer-panel" class="edu-panel active">
        <div class="trainer-layout">
            <div class="trainer-steps">
                <div>
                    <div class="step-title"><i class="fa-solid fa-map-location-dot"></i> Шаг 1: Раздел истории</div>
                    <div class="section-selector">
                        <div class="sec-btn selected" id="sec-russia-btn" onclick="selectTrainerSection('russia')">История России</div>
                        <div class="sec-btn" id="sec-world-btn" onclick="selectTrainerSection('world')">Всеобщая история</div>
                    </div>
                </div>
                <div>
                    <div class="step-title"><i class="fa-solid fa-clock"></i> Шаг 2: Исторический период</div>
                    <div class="selector-grid" id="trainer-themes-container">
                        </div>
                </div>
                <div>
                    <div class="step-title"><i class="fa-solid fa-layer-group"></i> Шаг 3: Уровень сложности</div>
                    <div class="difficulty-selector">
                        <div class="diff-btn easy selected" id="diff-easy-btn" onclick="selectTrainerDifficulty('easy', this)">Базовый</div>
                        <div class="diff-btn medium" id="diff-medium-btn" onclick="selectTrainerDifficulty('medium', this)">Профильный</div>
                        <div class="diff-btn hard" id="diff-hard-btn" onclick="selectTrainerDifficulty('hard', this)">Олимпиадный</div>
                    </div>
                </div>
            </div>
            
            <div class="quiz-container" id="quiz-block">
                <div class="quiz-card" id="main-quiz-card">
                    <div style="font-weight:800; color:var(--accent); margin-bottom:8px;" id="quiz-meta-info">Загрузка...</div>
                    <div class="quiz-question" id="quiz-question-text">Выберите период и сложность для старта...</div>
                    <div class="quiz-actions">
                        <input type="text" class="quiz-input" id="quiz-user-input" placeholder="Введите ваш ответ...">
                        <button class="quiz-submit-btn" id="quiz-sub-action" onclick="checkTrainerAnswer()">Ответить</button>
                        <button class="quiz-next-btn" id="quiz-next-action" onclick="renderSingleQuestion()">Следующий вопрос <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                    <div class="quiz-feedback" id="quiz-feedback-box"></div>
                </div>
            </div>
        </div>
    </div>
